# docker-compose.yml — levanta n8n + el servicio Python juntos
# ------------------------------------------------------------
# Reemplaza al .bat. Para arrancar todo:      docker compose up -d
# Para detener todo:                          docker compose down
# Para ver los logs:                          docker compose logs -f
#
# Son dos servicios (contenedores):
#   n8n          -> tu n8n de siempre, sin cambios de config.
#   facturacion  -> contenedor Python con el script + mini-servidor (app.py).
# Ambos comparten la carpeta de facturación y están en la misma red, así
# n8n puede llamar al servicio Python por su nombre.

services:

  # ── n8n ─────────────────────────────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - TZ=America/Argentina/Buenos_Aires
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
    volumes:
      # Los datos de n8n (workflows, credenciales) — mismo volumen de siempre.
      - n8n_data:/home/node/.n8n
      # La carpeta de facturación, para que el trigger vea archivos nuevos.
      - ".:/data/facturacion"

  # ── servicio Python ─────────────────────────────────────────────────────
  facturacion:
    build: ./servicio-python      # construye la imagen desde esa subcarpeta
    container_name: facturacion
    restart: unless-stopped
    volumes:
      # La MISMA carpeta compartida, para que el script lea/escriba las planillas.
      - ".:/data/facturacion"
    # No expone puerto al exterior: solo n8n lo llama, por la red interna.

volumes:
  # Volumen con nombre: persiste aunque borres los contenedores.
  n8n_data:
    external: true
